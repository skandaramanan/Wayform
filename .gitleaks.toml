# gitleaks config for wayform. Extends the built-in ruleset (AWS, GitHub,
# private keys, generic high-entropy, etc.) and adds the two wayform-specific
# credential shapes that leaked in the 2026-07-15 onboarding-doc incident.
# Enforced by .githooks/pre-commit locally and the secret-scan CI job.
title = "wayform gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "wayform-member-token"
description = "wayform gateway member token (mlk_)"
regex = '''mlk_[A-Za-z0-9_-]{40,}'''
keywords = ["mlk_"]

[[rules]]
id = "wayform-invite-code"
description = "wayform team invite code (wfi_)"
regex = '''wfi_[A-Za-z0-9_-]{40,}'''
keywords = ["wfi_"]

[allowlist]
description = "Placeholders and redacted values are not leaks"
regexes = [
  '''mlk_\.\.\.''',
  '''wfi_\.\.\.''',
  '''mlk_YAPIREDACTED''',
  '''mlk_THEIREDACTED''',
  '''<token>''',
  '''your_''',
]
# The token *prefixes* used to be minted in gateway source. Minting is gone;
# keep the regexes during migration so a leaked leftover still fails CI.
paths = [
  '''gateway/src/tenancy\.ts''',
  '''gateway/src/invites\.ts''',
  '''\.gitleaks\.toml''',
  # Archived design doc; line 268 is a template literal in a code sample that
  # GENERATES a throwaway keypair (`-----BEGIN PRIVATE KEY-----\n${b64}\n...`).
  # The PEM header is the format, not a committed key.
  '''docs/archived/2026-07-05-hosted-gateway-core\.md''',
  # Local, gitignored dev config holding real member tokens. Never committed
  # (CI checkouts don't contain them), but `gitleaks dir` reads the working
  # tree regardless of gitignore, so exclude them to keep local runs honest.
  '''^\.cursor/''',
  '''^\.codex/''',
  '''^\.claude/settings\.local\.json''',
  '''^\.memorylayer-hook\.env''',
]
