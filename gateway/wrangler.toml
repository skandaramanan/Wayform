name = "memorylayer-gateway"
main = "dist/gateway/src/worker.js"
compatibility_date = "2026-06-01"
# CIMD (RFC client_id metadata documents) requires this SSRF guard.
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
GITHUB_APP_SLUG = "memorylayer-gateway"
# GitHub numeric ids allowed to call /admin/*. A [vars] entry, not a secret:
# these ids are public, and the operator list belongs in version control where
# it can be reviewed. Empty/unset = nobody is an operator (fails closed).
ADMIN_GITHUB_IDS = ""

# Created in Step 3; paste the id wrangler prints.
[[kv_namespaces]]
binding = "ROUTING"
id = "799c559402d6472993dc63ed26b0fd5e"

# OAuth grants/clients. Same namespace as ROUTING until grants need isolation.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "799c559402d6472993dc63ed26b0fd5e"

# Relevance index (Phase A). Create with `wrangler d1 create memorylayer-index`
# and paste the printed database_id, then apply migrations:
#   wrangler d1 migrations apply memorylayer-index --remote
[[d1_databases]]
binding = "DB"
database_name = "memorylayer-index"
database_id = "652dbc7f-b71e-4f88-804a-d33b6da2b07c"
migrations_dir = "migrations"

# Abuse protection for UNAUTHENTICATED surfaces (gateway/src/rate-limit.ts).
# `period` accepts only 10 or 60; namespace_id is any positive integer unique
# within the account. /mcp is not limited — it requires a valid token, so abuse
# there is a revocation problem, not a throttling one.
[[ratelimits]]
name = "RL_AUTH"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# Workers AI: embeddings (@cf/baai/bge-base-en-v1.5), free-tier allocation.
[ai]
binding = "AI"

# Webhook-drop reconciler (§2.1): every 15 minutes, reindex spaces whose
# indexed sha lags the ledger HEAD.
[triggers]
crons = ["*/15 * * * *"]

# Workers Logs (free tier): per-invocation CPU time is the ground truth for
# the retrieval pipeline's 10ms budget — the in-code retrieval_timing line
# only sees wall time across awaits (clocks freeze during sync execution).
[observability]
enabled = true

# Workers Paid defaults to 30s CPU per invocation and bills $0.02 per additional
# million CPU-ms past the 30M included. Warm retrieval measures 42-69ms, so 5s
# is ~70x headroom while capping what a runaway loop could bill. Raise it if a
# legitimate reindex page ever trips it (visible as exceededCpu in Workers Logs).
[limits]
cpu_ms = 5000
