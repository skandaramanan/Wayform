name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded pushes on the same PR/branch so rebased commits do not
# stack full matrices against the monthly Actions allowance.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Linux covers the Node LTS matrix. macOS is 10× included minutes, so keep
  # a single smoke (Node 22) and only on pull_request — post-merge main pushes
  # already passed that smoke on the PR and should not burn another 10× slot.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 18
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: macos-latest
            node: 22
            pr_only: true
    if: ${{ !(matrix.pr_only && github.event_name != 'pull_request') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: cd gateway && npm ci
      - run: npm run test:gateway

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          ver=$(curl -sSfL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep -oE '"tag_name": *"v[^"]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      # Scan the working tree (not history): the rotated 2026-07-15 leaks live
      # only in old commits and are dead, so a history scan would fail forever.
      # This catches any NEW secret that reaches a committed file.
      - run: gitleaks dir . --redact --verbose --config .gitleaks.toml
