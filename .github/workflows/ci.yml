name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded pushes on the same PR/branch so rebases do not stack
# full matrices against the monthly Actions allowance.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Linux covers the Node LTS matrix on every PR and every main push.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  # macOS is 10× included minutes. One smoke on PRs only — main already
  # passed this on the PR and should not burn another 10× slot after merge.
  test-macos:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: cd gateway && npm ci
      - run: npm run test:gateway

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version is PINNED, not resolved from the API. Querying
      # /releases/latest unauthenticated is rate-limited on shared runners: it
      # returned 403 on 2026-09-13, ver came back empty, the download URL was
      # malformed, and this security job failed for a reason that had nothing
      # to do with secrets. Pinning also stops a security check from installing
      # whatever happens to be newest. Bump deliberately.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      # Scans the working tree, not history.
      #
      # NOTE (2026-09-13): the original reason for this — "the 2026-07-15 leaks
      # live in old commits forever" — no longer holds. Those commits were
      # excised with git filter-repo on 2026-09-12 and all four token patterns
      # now scan clean across every ref, so `gitleaks git` would pass today.
      # Left as a working-tree scan deliberately: it is fast, and it cannot be
      # re-poisoned into permanent failure by one bad commit that gets reverted.
      - run: gitleaks dir . --redact --verbose --config .gitleaks.toml
